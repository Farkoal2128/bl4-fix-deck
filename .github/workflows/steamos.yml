name: SteamOS package

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and virtual-display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python -m pip install pyinstaller==6.11.1
      - name: Test SteamOS installer and platform boundaries
        run: python dev/steamos_test.py
      - name: Check shared copies
        run: python tools/sync_shared.py --check
      - name: Test setup window and its controls
        run: xvfb-run -a python dev/steamos_gui_test.py
      - name: Build standalone SteamOS installer
        run: python tools/build_steamos.py --native
      - name: Test the bundled executable and its Tk runtime
        run: xvfb-run -a dist/BL4FixSetup-SteamOS --smoke-test
      - name: Verify published SteamOS release files
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern 'BL4FixSetup-SteamOS.tar.gz*' --pattern 'BL4Fix-SteamOS.zip*'
          (cd published && sha256sum --check BL4FixSetup-SteamOS.tar.gz.sha256 BL4Fix-SteamOS.zip.sha256)
          cmp dist/BL4Fix-SteamOS.zip published/BL4Fix-SteamOS.zip
          tar -xzf published/BL4FixSetup-SteamOS.tar.gz -C published
          xvfb-run -a published/BL4FixSetup-SteamOS/BL4FixSetup-SteamOS --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: BL4Fix-SteamOS
          path: |
            dist/BL4Fix-SteamOS.zip
            dist/BL4Fix-SteamOS.zip.sha256
            dist/BL4FixSetup-SteamOS.tar.gz
            dist/BL4FixSetup-SteamOS.tar.gz.sha256
          if-no-files-found: error
